{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error (500) - Symposium Food Counter</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body">
    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
        <div class="login-card-wrapper text-center">
            <div class="login-brand-icon mb-3" style="font-size: 3rem;">⚠️</div>
            <h1 class="fw-extrabold text-white mb-2">500</h1>
            <h4 class="text-light mb-3">Internal Server Error</h4>
            <p class="text-secondary small mb-4">
                Something unexpected happened on the server. Please verify your environment variables or try again in a moment.
            </p>
            <div class="d-flex flex-column gap-2">
                <a href="{% url 'food:dashboard' %}" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                    📊 Reload Dashboard
                </a>
                <a href="{% url 'food:login' %}" class="btn btn-outline-light w-100 py-2 fw-semibold">
                    🔑 Return to Login
                </a>
            </div>
            <div class="text-center mt-4 pt-2 border-top border-secondary-subtle">
                <small class="text-muted">Symposium Admin Portal • Secure Food Counter</small>
            </div>
        </div>
    </div>
</body>
</html>
